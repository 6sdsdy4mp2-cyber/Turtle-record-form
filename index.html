<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>烏龜日誌</title>
<style>
:root{--bg:#eef4ef;--panel:#fff;--ink:#17302f;--mut:#5d7775;--line:#d3e0da;--moss:#3f8a4f;--sun:#e39a12;--water:#2f7f86;--warn:#b84a2a;--hex:#dbe8e2;
font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2427;--panel:#16363a;--ink:#e6f1ee;--mut:#90b0ac;--line:#25494d;--moss:#7fc08a;--sun:#f2b441;--water:#5cb6bd;--hex:#1f464a}}
:root[data-theme="dark"]{--bg:#0e2427;--panel:#16363a;--ink:#e6f1ee;--mut:#90b0ac;--line:#25494d;--moss:#7fc08a;--sun:#f2b441;--water:#5cb6bd;--hex:#1f464a}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);position:fixed;inset:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:60%;background:radial-gradient(ellipse at 30% 0,color-mix(in srgb,var(--water) 28%,transparent),transparent 65%);pointer-events:none}
.wrap{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.head{flex:none;padding:12px 16px 4px;border-bottom:1px solid var(--line);background:var(--bg)}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 16px calc(40px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--water);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
textarea{resize:vertical;min-height:60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:1px;flex:1}
.swim{width:44px;animation:bob 3.4s ease-in-out infinite}

@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes paddle{50%{transform:rotate(14deg)}}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;overscroll-behavior-x:contain}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-size:14px;white-space:nowrap}
.chip.on{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:600}
.chip.ghost{border-style:dashed;color:var(--water);border-color:var(--water);background:transparent}
.shell{padding:6px 0 14px}
.shell h2,.sec h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
.hexrow{display:flex;justify-content:space-between;gap:2px}
.hx{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.hx svg{width:100%;display:block;overflow:visible}
.hx polygon{fill:var(--hex);stroke:var(--line);stroke-width:2;transition:fill .6s,transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 50%;transform:scale(.3)}
.hx.in polygon{transform:scale(1)}
.hx.sun polygon{fill:var(--sun);stroke:var(--sun)}
.hx.no polygon{fill:var(--water);opacity:.55}
.hx.cur polygon{stroke:var(--ink);stroke-width:3}
.hx text{font-size:20px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.stats{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:20px;color:var(--ink)}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.datebar strong{font-size:17px}
.datebar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}
.datebar button:disabled{opacity:.3}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.f{margin-bottom:16px}.f:last-child{margin-bottom:0}
.f>label,.lab{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--moss);background:transparent;font-size:22px;color:var(--moss)}
.step output{font-size:28px;font-weight:800;min-width:40px;text-align:center;display:inline-block}
.step output.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.35)}}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px}
.tag.on{background:var(--water);border-color:var(--water);color:#fff}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:transparent}
.seg button.sunon{background:var(--sun);border-color:var(--sun);color:#1c1500;font-weight:700}
.seg button.on{background:var(--water);border-color:var(--water);color:#fff;font-weight:700}
.durbox{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.durbox.open{grid-template-rows:1fr}
.durbox>div{overflow:hidden}
.durbox .in{padding-top:12px}
.two{display:flex;gap:10px}.two>*{flex:1}
.saved{font-size:12px;color:var(--mut);min-height:16px;margin:10px 0 0}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--moss);color:#fff;font-weight:700;font-size:15px}
.btn.alt{background:transparent;border:1.5px solid var(--water);color:var(--water)}
.btn.bad{background:var(--warn)}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist:last-child{border:0}
.hist .b{flex:1;cursor:pointer;line-height:1.5}.hist .b b{font-size:14px}
.hist .b span{color:var(--mut)}
.hist .x{border:0;background:transparent;color:var(--mut);font-size:18px;padding:6px}
.empty{color:var(--mut);font-size:13px;margin:0}
.ov{position:fixed;inset:0;background:rgba(5,20,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.md{background:var(--panel);width:100%;max-width:480px;max-height:88%;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
.md h3{margin:0 0 14px;font-size:17px}
.md .acts{display:flex;gap:10px;margin-top:14px}.md .acts button{flex:1}
.rp{margin-bottom:16px;padding-left:12px;border-left:4px solid var(--sun);font-size:14px;line-height:1.8}
.rp b{display:block;font-size:15px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.pics:empty{display:none}
.pic{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--hex);animation:pop .3s}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
.addpic{display:block;text-align:center;margin-top:10px;padding:11px;font-size:14px}
.tag.on.bad{background:var(--warn);border-color:var(--warn)}
.page{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .3s cubic-bezier(.2,.9,.3,1)}
.ph{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:17px;flex:1}
.ph button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:0 16px;height:44px}
.pb{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:760px;margin:0 auto}
.rt{border-collapse:separate;border-spacing:0;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:100%}
.rt th,.rt td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:112px;line-height:1.5}
.rt tr:last-child td,.rt tr:last-child th{border-bottom:0}
.rt thead th{background:var(--hex);font-size:14px}
.rt tbody th{position:sticky;left:0;background:var(--panel);min-width:70px;color:var(--mut);font-weight:600;z-index:1}
.rt thead th:first-child{position:sticky;left:0;z-index:2;min-width:70px}
.rt .badt{color:var(--warn);font-weight:700}
.rt .no{color:var(--mut);font-weight:400}
.rt img{width:64px;height:64px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;display:inline-block}
.qr{display:flex;justify-content:center;margin:6px 0 12px}
.qr img{width:230px;height:230px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;animation:tin .3s,tout .3s 2.2s forwards}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
@keyframes tout{to{opacity:0}}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hx polygon{transform:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="head">
  <div class="top">
    <svg class="swim" viewBox="0 0 64 48" aria-hidden="true"><g class="fl"><ellipse cx="14" cy="34" rx="9" ry="4.5" fill="#6aa86f"/><ellipse cx="46" cy="36" rx="9" ry="4.5" fill="#6aa86f"/></g><circle cx="56" cy="22" r="7" fill="#6aa86f"/><circle cx="58" cy="20" r="1.4" fill="#17302f"/><ellipse cx="30" cy="24" rx="22" ry="15" fill="#3f8a4f"/><path d="M18 24h24M30 10v28M20 15l20 18M40 15L20 33" stroke="#2c6a3a" stroke-width="1.6" fill="none"/></svg>
    <h1>烏龜日誌</h1>
    <button class="ic" id="themeBtn" aria-label="切換主題">🌓</button>
    <button class="ic" id="bkBtn" aria-label="備份同匯入">💾</button>
    <button class="ic" id="syncBtn" aria-label="雙機同步">🔗</button>
  </div>
  <div class="chips" id="bar"></div>
  <div class="datebar">
    <button id="prev" aria-label="前一日">‹</button>
    <strong id="dlabel"></strong>
    <button id="next" aria-label="後一日">›</button>
  </div>
  </div>
  <main class="scroll">
  <div class="shell">
    <h2>最近 7 日曬太陽</h2>
    <div class="hexrow" id="hexes"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="sec">
    <div class="f"><span class="lab">餵食次數</span>
      <div class="step"><button data-feed="-1" aria-label="減少">−</button><output id="feed">0</output><button data-feed="1" aria-label="增加">+</button></div></div>
    <div class="f"><label for="amount">每次份量</label><input id="amount" placeholder="例如：一粒拇指大 / 5g"></div>
    <div class="f"><span class="lab">食咗啲咩</span>
      <div class="wrapchips" id="foods"></div>
      <input id="other" placeholder="其他食物（可留空）" style="margin-top:10px"></div>
    <div class="f"><span class="lab">今日有冇曬太陽？</span>
      <div class="seg"><button id="sY">有曬</button><button id="sN">冇曬</button></div>
      <div class="durbox" id="durbox"><div><div class="in">
        <div class="wrapchips" id="durchips"></div>
        <input type="number" id="dur" min="0" max="600" inputmode="numeric" placeholder="分鐘" style="margin-top:10px"></div></div></div></div>
    <div class="f two">
      <div><span class="lab">換水</span><div class="seg"><button id="wY">已換</button></div></div>
      <div><label for="weight">體重（g）</label><input type="number" id="weight" min="0" step="0.1" inputmode="decimal"></div></div>
    <div class="f"><span class="lab">糞便狀況</span>
      <div class="wrapchips" id="poops"></div>
      <div class="pics" id="pics"></div>
      <label class="btn alt addpic" id="addpic">📷 拍照／從相簿選取<input type="file" id="file" class="vh" accept="image/*" multiple></label></div>
    <div class="f"><label for="note">備註</label><textarea id="note" placeholder="精神、食慾、排泄、有冇異常…"></textarea></div>
    <p class="saved" id="saved">改動會自動儲存</p>
  </div>

  <button class="btn" id="repBtn" style="margin-bottom:14px">生成日報表格</button>

  <div class="sec" style="margin-top:6px">
    <h2 style="margin-bottom:6px">歷史記錄</h2>
    <div id="hist"></div>
  </div>
  <button class="btn alt" id="editT">編輯／刪除目前烏龜</button>
  </main>
</div>

<script>
var K='turtleDiary2';
var FOODS=['龜糧','小魚','蝦乾','菜葉','麵包蟲','蚯蚓'],DURS=[15,30,45,60,90];
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function ld(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
var S=ld(K,null);
if(!S){var oL=ld('turtle_logs',{}),nL={};Object.keys(oL).forEach(function(id){nL[id]={};Object.keys(oL[id]||{}).forEach(function(d){var o=oL[id][d]||{};nL[id][d]=Object.assign(blank(),{feed:o.feedCount||0,amount:o.amount||'',other:o.food||'',sun:o.sun===true?true:o.sun===false?false:null,dur:o.duration==null?'':o.duration})})});
  S={turtles:ld('turtles',[]),logs:nL,active:null,shown:{},theme:'auto'};}
if(!S.turtles.some(function(t){return t.id===S.active}))S.active=S.turtles.length?S.turtles[0].id:null;
S.shown=S.shown||{};
function persist(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){return false}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function shift(s,n){var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return ymd(d)}
var WD=['日','一','二','三','四','五','六'];
function wd(s){var p=s.split('-');return WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()]}
var date=today(),lastDay=date,cur={},tm;
function T(){return S.turtles.find(function(t){return t.id===S.active})}
function logs(id){return S.logs[id||S.active]||{}}
function toast(m){var o=document.createElement('div');o.className='toast';o.textContent=m;document.body.appendChild(o);setTimeout(function(){o.remove()},2600)}

/* theme */
function applyTheme(){if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme)}
$('#themeBtn').onclick=function(){S.theme=S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto';applyTheme();persist();toast('主題：'+({auto:'跟隨系統',dark:'深色',light:'淺色'})[S.theme])};

/* turtles */
function renderBar(){
  var h=S.turtles.map(function(t){return '<button class="chip'+(t.id===S.active?' on':'')+'" data-id="'+esc(t.id)+'">'+esc(t.name)+'（'+esc(t.gender)+'）</button>'}).join('');
  $('#bar').innerHTML=h+'<button class="chip ghost" id="addT">＋ 新增烏龜</button>';
}
$('#bar').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='addT')return turtleModal(null);
  S.active=b.dataset.id;persist();renderAll()};
$('#editT').onclick=function(){turtleModal(T())};
function turtleModal(t,force){
  commit();var g=t?t.gender:'未知';
  modal('<h3>'+(force?'🐢 歡迎！先新增你嘅第一隻烏龜':t?'編輯烏龜':'新增烏龜')+'</h3><div class="f"><label>名稱</label><input id="tn" maxlength="12" value="'+esc(t?t.name:'')+'" placeholder="例如：阿寶"></div><div class="f"><span class="lab">性別</span><div class="seg" id="tg">'+['未知','公','乸'].map(function(x){return '<button data-g="'+x+'" class="'+(x===g?'on':'')+'">'+x+'</button>'}).join('')+'</div></div><div class="acts">'+(force?'':'<button class="btn alt" data-x>取消</button>')+(t&&S.turtles.length>1?'<button class="btn bad" id="tdel">刪除</button>':'')+'<button class="btn" id="tok">儲存</button></div>',force);
  $('#tg').onclick=function(e){var b=e.target.closest('button');if(!b)return;g=b.dataset.g;[].forEach.call($('#tg').children,function(x){x.classList.toggle('on',x===b)})};
  $('#tok').onclick=function(){var n=$('#tn').value.trim();if(!n){$('#tn').focus();return toast('請輸入烏龜名稱')}
    if(t){t.name=n;t.gender=g}else{t={id:'t'+Date.now()+Math.random().toString(36).slice(2,5),name:n,gender:g,ts:Date.now()};S.turtles.push(t);S.active=t.id}
    if(cl())CL.putTurtle(S.room,t);persist();closeModal();renderAll()};
  var d=$('#tdel');if(d)d.onclick=function(){if(!d.dataset.sure){d.dataset.sure=1;d.textContent='再按一次確認';return}
    S.turtles=S.turtles.filter(function(x){return x.id!==t.id});Object.keys(S.logs[t.id]||{}).forEach(function(d){((S.logs[t.id][d].pics)||[]).forEach(delPic)});delete S.logs[t.id];if(cl())CL.delTurtle(S.room,t.id);S.active=S.turtles[0].id;persist();closeModal();renderAll();toast('已刪除')};
}

/* modal */
function modal(html,lock){closeModal();var o=document.createElement('div');o.className='ov';o.id='ov';if(lock)o.dataset.lock=1;o.innerHTML='<div class="md" role="dialog">'+html+'</div>';
  o.onclick=function(e){if(lock)return;if(e.target===o||e.target.hasAttribute('data-x'))closeModal()};document.body.appendChild(o)}
function closeModal(){var o=$('#ov');if(o)o.remove()}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var o=$('#ov');if(o){if(!o.dataset.lock)closeModal()}else closeRpt()}});

/* form */
function blank(){return{feed:0,amount:'',foods:[],other:'',sun:null,dur:'',water:false,weight:'',poop:'',pics:[],note:''}}
function fill(){
  cur=Object.assign(blank(),logs()[date]||{});cur.foods=(cur.foods||[]).slice();cur.pics=(cur.pics||[]).slice();
  $('#feed').textContent=cur.feed;$('#amount').value=cur.amount;$('#other').value=cur.other;
  $('#dur').value=cur.dur;$('#weight').value=cur.weight;$('#note').value=cur.note;
  paintFoods();paintSun();paintWater();paintPoop();
  $('#saved').textContent=logs()[date]?'已有記錄，改動會自動儲存':'改動會自動儲存';
}
function paintFoods(){$('#foods').innerHTML=FOODS.map(function(f){return '<button class="tag'+(cur.foods.indexOf(f)>-1?' on':'')+'" data-f="'+f+'">'+f+'</button>'}).join('')}
function paintSun(){
  $('#sY').className=cur.sun===true?'sunon':'';$('#sN').className=cur.sun===false?'on':'';
  $('#durbox').classList.toggle('open',cur.sun===true);
  $('#durchips').innerHTML=DURS.map(function(m){return '<button class="tag'+(+cur.dur===m?' on':'')+'" data-d="'+m+'">'+m+' 分</button>'}).join('');
}
function paintWater(){$('#wY').className=cur.water?'on':''}
var pend=null;
function commit(){clearTimeout(tm);if(!pend)return;var p=pend;pend=null;
  if(!S.logs[p.id])S.logs[p.id]={};
  S.logs[p.id][p.d]=p.e;if(cl())CL.putLog(S.room,p.id,p.d,p.e);
  var ok=persist();
  $('#saved').textContent=ok?'已自動儲存 ✓ '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}):'⚠️ 無法儲存到瀏覽器，請用右上角 💾 備份';
  renderShell(false);renderHist()}
function touch(){pend={id:S.active,d:date,e:Object.assign({},cur,{foods:cur.foods.slice(),pics:cur.pics.slice(),t:Date.now()})};clearTimeout(tm);tm=setTimeout(commit,500)}
document.querySelectorAll('[data-feed]').forEach(function(b){b.onclick=function(){
  cur.feed=Math.max(0,Math.min(30,cur.feed+(+b.dataset.feed)));var o=$('#feed');o.textContent=cur.feed;o.classList.remove('pop');void o.offsetWidth;o.classList.add('pop');touch()}});
$('#foods').onclick=function(e){var b=e.target.closest('button');if(!b)return;var f=b.dataset.f,i=cur.foods.indexOf(f);if(i>-1)cur.foods.splice(i,1);else cur.foods.push(f);paintFoods();touch()};
$('#amount').oninput=function(){cur.amount=this.value;touch()};
$('#other').oninput=function(){cur.other=this.value;touch()};
$('#note').oninput=function(){cur.note=this.value;touch()};
$('#sY').onclick=function(){cur.sun=cur.sun===true?null:true;paintSun();touch()};
$('#sN').onclick=function(){cur.sun=cur.sun===false?null:false;cur.dur='';$('#dur').value='';paintSun();touch()};
$('#durchips').onclick=function(e){var b=e.target.closest('button');if(!b)return;cur.dur=+b.dataset.d;$('#dur').value=cur.dur;paintSun();touch()};
$('#dur').oninput=function(){var v=this.value===''?'':Math.max(0,Math.min(600,+this.value));cur.dur=v;paintSun();touch()};
$('#wY').onclick=function(){cur.water=!cur.water;paintWater();touch()};
$('#weight').oninput=function(){cur.weight=this.value===''?'':Math.max(0,+this.value);touch()};

/* poop + photos */
var POOPS=['正常','偏軟','稀水','偏硬','異常','冇排便'],PC={},db=null;
function idb(){return new Promise(function(res){if(db)return res(db);try{var r=indexedDB.open('turtlePics',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){db=r.result;res(db)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function putPic(id,data){return idb().then(function(d){return new Promise(function(res){if(!d)return res(false);try{var tx=d.transaction('p','readwrite');tx.objectStore('p').put(data,id);tx.oncomplete=function(){res(true)};tx.onerror=function(){res(false)}}catch(e){res(false)}})})}
function getPic(id){return getLocal(id).then(function(r){if(r||!window.CL||!S.room)return r;return CL.getPic(S.room,id).then(function(d){if(d){PC[id]=d;putPic(id,d)}return d})})}
function getLocal(id){if(PC[id])return Promise.resolve(PC[id]);return idb().then(function(d){return new Promise(function(res){if(!d)return res(null);try{var q=d.transaction('p').objectStore('p').get(id);q.onsuccess=function(){if(q.result)PC[id]=q.result;res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})})}
function delPic(id){delete PC[id];if(cl())CL.delPic(S.room,id);idb().then(function(d){try{if(d)d.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}})}
function shrink(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function paintPoop(){
  $('#poops').innerHTML=POOPS.map(function(p){return '<button class="tag'+(cur.poop===p?' on':'')+((p==='稀水'||p==='異常')?' bad':'')+'" data-p="'+p+'">'+p+'</button>'}).join('');
  $('#pics').innerHTML=cur.pics.map(function(id){return '<div class="pic"><img alt="糞便相片" data-id="'+esc(id)+'"><button data-rm="'+esc(id)+'" aria-label="刪除相片">✕</button></div>'}).join('');
  [].forEach.call($('#pics').querySelectorAll('img'),function(im){getPic(im.dataset.id).then(function(d){if(d)im.src=d})});
  $('#addpic').classList.toggle('hide',cur.pics.length>=3)}
$('#poops').onclick=function(e){var b=e.target.closest('button');if(!b)return;cur.poop=cur.poop===b.dataset.p?'':b.dataset.p;paintPoop();touch()};
$('#pics').onclick=function(e){var b=e.target.closest('[data-rm]');if(!b)return;var id=b.dataset.rm;cur.pics=cur.pics.filter(function(x){return x!==id});delPic(id);paintPoop();touch()};
$('#file').onchange=function(){var fs=[].slice.call(this.files).slice(0,3-cur.pics.length),ctx=cur;this.value='';
  if(!fs.length)return toast('每日最多 3 張相片');
  fs.forEach(function(f){shrink(f).then(function(data){
    if(ctx!==cur||ctx.pics.length>=3)return;
    var id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    PC[id]=data;ctx.pics.push(id);paintPoop();touch();
    putPic(id,data).then(function(ok){if(!ok&&!cl())toast('相片可能無法長期保存')});if(cl())CL.putPic(S.room,id,data);
  },function(){toast('讀取相片失敗')})})};
function cleanLogs(L){var r={};Object.keys(L||{}).forEach(function(id){r[id]={};var m=L[id]||{};Object.keys(m).forEach(function(d){if(!/^\d{4}-\d\d-\d\d$/.test(d))return;var e=m[d]||{};r[id][d]={feed:Math.max(0,Math.min(30,+e.feed||0)),amount:String(e.amount||'').slice(0,80),foods:(Array.isArray(e.foods)?e.foods:[]).filter(function(f){return FOODS.indexOf(f)>-1}),other:String(e.other||'').slice(0,80),sun:e.sun===true?true:e.sun===false?false:null,dur:e.dur===''||e.dur==null?'':Math.max(0,Math.min(600,+e.dur||0)),water:!!e.water,weight:e.weight===''||e.weight==null?'':Math.max(0,+e.weight||0),poop:POOPS.indexOf(e.poop)>-1?e.poop:'',pics:(Array.isArray(e.pics)?e.pics:[]).filter(function(p){return /^p[a-z0-9]+$/i.test(p)}).slice(0,3),note:String(e.note||'').slice(0,500),t:+e.t||0}})});return r}

/* cloud sync */
function cl(){return !!(window.CL&&S.room)}
function sig(e){var c=cleanLogs({x:{'2000-01-01':e}}).x['2000-01-01'];c.t=0;return JSON.stringify(c)}
function hashRoom(){var m=/[#&]r=([a-f0-9]{24,64})/.exec(location.hash);return m?m[1]:null}
function badge(){var b=$('#syncBtn');b.style.borderColor=cl()?'var(--moss)':'var(--line)';b.style.boxShadow=cl()?'0 0 0 2px var(--moss)':'none'}
function pushAll(){S.turtles.forEach(function(t,i){if(!t.ts)t.ts=1e12+i});persist();CL.pushAll(S.room,S.turtles,S.logs);
  Object.keys(S.logs).forEach(function(id){Object.keys(S.logs[id]).forEach(function(d){((S.logs[id][d].pics)||[]).forEach(function(p){getLocal(p).then(function(x){if(x)CL.putPic(S.room,p,x)})})})})}
function onRT(v){if(!v)return;
  var a=Object.keys(v).map(function(id){var o=v[id]||{};return{id:id,name:String(o.name||'烏龜').slice(0,12),gender:['公','乸'].indexOf(o.gender)>-1?o.gender:'未知',ts:+o.ts||0}}).sort(function(x,y){return x.ts-y.ts});
  if(!a.length||JSON.stringify(a)===JSON.stringify(S.turtles))return;
  S.turtles=a;if(!a.some(function(t){return t.id===S.active}))S.active=a[0].id;persist();
  var o=$('#ov');if(o&&o.dataset.lock)closeModal();renderAll()}
function onRL(v){var nl=cleanLogs(v||{});
  if(pend){nl[pend.id]=nl[pend.id]||{};nl[pend.id][pend.d]=pend.e}
  S.logs=nl;persist();renderShell(false);renderHist();
  if(!pend){var r=(nl[S.active]||{})[date]||blank();if(sig(r)!==sig(cur))fill()}}
function startSync(){if(!cl())return;CL.ready.then(function(ok){if(!ok){toast('雲端登入失敗，請檢查 Firebase 匿名登入設定');return}CL.listen(S.room,onRT,onRL);badge()})}
function createRoom(){var b=new Uint8Array(16);crypto.getRandomValues(b);
  S.room=[].map.call(b,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');persist();
  CL.ready.then(function(ok){if(!ok){S.room=null;persist();return toast('雲端登入失敗，請先在 Firebase 啟用匿名登入')}
    pushAll();CL.listen(S.room,onRT,onRL);badge();syncModal()})}
function joinRoom(r){commit();CL.stop();S.room=r;S.turtles=[];S.logs={};S.active=null;persist();
  history.replaceState(null,'',location.pathname+location.search);renderAll();toast('正在連接…');startSync();
  setTimeout(function(){if(!S.turtles.length&&!$('#ov'))turtleModal(null,true)},6000)}
function syncModal(){
  if(!window.CL){modal('<h3>🔗 雙機同步</h3><p class="empty">未連接雲端。請把頁面放到 Firebase Hosting（或你自己的網站）後再使用。</p><div class="acts"><button class="btn alt" data-x>關閉</button></div>');return}
  if(!S.room){modal('<h3>🔗 雙機同步</h3><p class="empty" style="margin-bottom:6px">建立後會顯示 QR Code，另一部手機用相機掃描就會加入，兩部手機即時共用烏龜、記錄同相片。</p><div class="acts"><button class="btn alt" data-x>取消</button><button class="btn" id="mk">建立同步</button></div>');$('#mk').onclick=createRoom;return}
  var url=location.origin+location.pathname+'#r='+S.room;
  modal('<h3>🔗 同步中</h3><div class="qr" id="qr"></div><p class="empty" style="text-align:center">用另一部手機的相機掃描，打開連結就會加入。<br>請勿把 QR Code 分享給不相關的人。</p><div class="acts"><button class="btn alt" id="lv">停止同步</button><button class="btn" id="cu">複製連結</button></div>');
  try{var o=qrcode(0,'M');o.addData(url);o.make();$('#qr').innerHTML='<img alt="QR Code" src="'+o.createDataURL(6,3)+'">'}catch(e){$('#qr').textContent=url}
  $('#cu').onclick=function(){copy(url,'已複製連結')};
  $('#lv').onclick=function(){var b=$('#lv');if(!b.dataset.s){b.dataset.s=1;b.textContent='再按一次確認';return}CL.stop();S.room=null;persist();closeModal();badge();toast('已停止同步，資料保留在本機')}}
$('#syncBtn').onclick=function(){commit();syncModal()};
function boot(){var r=hashRoom();
  if(r&&r!==S.room){var has=Object.keys(S.logs).some(function(k){return Object.keys(S.logs[k]).length});
    if(!has)return joinRoom(r);
    modal('<h3>加入同步？</h3><p class="empty" style="margin-bottom:10px">加入後，這部裝置目前的記錄會被另一部裝置的資料取代。建議先用 💾 備份。</p><div class="acts"><button class="btn alt" id="jn">取消</button><button class="btn" id="jy">加入</button></div>',true);
    $('#jn').onclick=function(){history.replaceState(null,'',location.pathname+location.search);closeModal()};
    $('#jy').onclick=function(){closeModal();joinRoom(r)};return}
  startSync();badge()}

/* date nav */
function paintDate(){var td=today();$('#dlabel').textContent=date+'（週'+wd(date)+'）'+(date===td?' 今日':'');$('#next').disabled=date>=td}
$('#prev').onclick=function(){date=shift(date,-1);renderAll()};
$('#next').onclick=function(){if(date<today()){date=shift(date,1);renderAll()}};

/* shell chart + stats */
function renderShell(anim){
  var L=logs(),td=today(),h='',i,d,e,cls,txt,max=0;
  for(i=6;i>=0;i--){d=shift(td,-i);e=L[d];
    cls=e&&e.sun===true?'sun':e&&e.sun===false?'no':'';txt=e&&e.sun===true?(e.dur||'✓'):'';
    h+='<div class="hx '+cls+(d===date?' cur':'')+(anim?'':' in')+'" data-d="'+d+'"'+(anim?' style="transition-delay:'+(6-i)*60+'ms"':'')+'><svg viewBox="0 0 60 66"><polygon points="30,3 57,17 57,49 30,63 3,49 3,17"/><text x="30" y="34">'+txt+'</text></svg>'+wd(d)+'</div>'}
  $('#hexes').innerHTML=h;
  if(anim)requestAnimationFrame(function(){requestAnimationFrame(function(){document.querySelectorAll('.hx').forEach(function(x){x.classList.add('in')})})});
  var streak=0;d=td;if(!(L[d]&&L[d].sun===true))d=shift(d,-1);
  while(L[d]&&L[d].sun===true){streak++;d=shift(d,-1)}
  var tot=0,n=0;for(i=0;i<7;i++){e=L[shift(td,-i)];if(e&&e.sun===true){tot+=+e.dur||0;n++}}
  var ws=Object.keys(L).filter(function(k){return L[k].weight!==''&&L[k].weight!=null}).sort(),w='—',dw='';
  if(ws.length){w=L[ws[ws.length-1]].weight+' g';if(ws.length>1){var df=L[ws[ws.length-1]].weight-L[ws[ws.length-2]].weight;dw=' ('+(df>=0?'+':'')+df.toFixed(1)+')'}}
  $('#stats').innerHTML='<div><b>'+streak+' 日</b>連續曬太陽</div><div><b>'+(n?Math.round(tot/n):0)+' 分</b>曬日平均</div><div><b>'+esc(w)+'</b>最新體重'+esc(dw)+'</div>';
}
$('#hexes').onclick=function(e){var h=e.target.closest('.hx');if(h){date=h.dataset.d;renderAll()}};

/* history */
function sunTxt(e){return e.sun===true?'曬太陽 '+(e.dur||'—')+' 分':e.sun===false?'冇曬太陽':'曬太陽未記錄'}
function renderHist(){
  var L=logs(),ds=Object.keys(L).sort().reverse().slice(0,30);
  $('#hist').innerHTML=ds.length?ds.map(function(d){var e=L[d],f=(e.foods||[]).concat(e.other?[e.other]:[]).join('、');
    return '<div class="hist"><div class="b" data-d="'+d+'"><b>'+d+'（週'+wd(d)+'）</b><br><span>餵 '+(e.feed||0)+' 次'+(f?'・'+esc(f):'')+'・'+sunTxt(e)+(e.water?'・已換水':'')+(e.poop?'・糞便'+e.poop:'')+((e.pics&&e.pics.length)?'・📷'+e.pics.length:'')+(e.weight!==''&&e.weight!=null?'・'+e.weight+'g':'')+'</span></div><button class="x" data-del="'+d+'" aria-label="刪除">✕</button></div>'}).join(''):'<p class="empty">未有記錄。揀返上面日期，填第一筆就會喺度出現。</p>';
}
$('#hist').onclick=function(e){var x=e.target.closest('[data-del]');
  if(x){if(x.dataset.sure){commit();var oe=S.logs[S.active][x.dataset.del];((oe&&oe.pics)||[]).forEach(delPic);delete S.logs[S.active][x.dataset.del];if(cl())CL.delLog(S.room,S.active,x.dataset.del);persist();renderAll();toast('已刪除記錄')}else{x.dataset.sure=1;x.textContent='確認?';x.style.color='var(--warn)'}return}
  var b=e.target.closest('[data-d]');if(b){date=b.dataset.d;renderAll();window.scrollTo({top:0,behavior:'smooth'})}};

/* report */
function reportLines(id,d){var t=S.turtles.find(function(x){return x.id===id}),e=(S.logs[id]||{})[d];if(!t)return null;
  if(!e)return[t.name+'（'+t.gender+'）','未有記錄'];
  var f=(e.foods||[]).concat(e.other?[e.other]:[]).join('、')||'未記錄';
  return[t.name+'（'+t.gender+'）',
   '餵食：'+(e.feed||0)+' 次'+(e.amount?'，每次 '+e.amount:''),'食物：'+f,'曬太陽：'+(e.sun===true?'有，約 '+(e.dur||'—')+' 分鐘':e.sun===false?'冇':'未記錄'),
   '換水：'+(e.water?'已換':'未換'),'糞便：'+(e.poop||'未記錄')+((e.pics&&e.pics.length)?'（附 '+e.pics.length+' 張相片）':''),e.weight!==''&&e.weight!=null?'體重：'+e.weight+' g':null,e.note?'備註：'+e.note:null].filter(Boolean)}
function closeRpt(){var p=$('#rpt');if(p)p.remove()}
function reportPage(d){
  commit();if(!S.turtles.length)return;closeRpt();
  var ts=S.turtles,txt=[d+' 烏龜日報'];
  var R=[
   ['餵食',function(e){return esc(e.feed||0)+' 次'}],
   ['份量',function(e){return esc(e.amount)||'—'}],
   ['食物',function(e){return esc((e.foods||[]).concat(e.other?[e.other]:[]).join('、'))||'—'}],
   ['曬太陽',function(e){return e.sun===true?'有，'+esc(e.dur||'—')+' 分鐘':e.sun===false?'冇':'未記錄'}],
   ['換水',function(e){return e.water?'已換':'未換'}],
   ['體重',function(e){return e.weight!==''&&e.weight!=null?esc(e.weight)+' g':'—'}],
   ['糞便',function(e){return e.poop?'<span class="'+(e.poop==='稀水'||e.poop==='異常'?'badt':'')+'">'+esc(e.poop)+'</span>':'未記錄'}],
   ['相片',function(e){return (e.pics||[]).map(function(id){return '<img data-id="'+esc(id)+'" alt="糞便相片">'}).join('')||'—'}],
   ['備註',function(e){return esc(e.note)||'—'}]];
  ts.forEach(function(t){txt.push('',reportLines(t.id,d).join('\n'))});
  var h='<div class="ph"><button id="rb">‹ 返回</button><h3>'+esc(d)+' 日報</h3><button id="rc">複製</button></div><div class="pb"><table class="rt"><thead><tr><th></th>'+ts.map(function(t){return '<th>'+esc(t.name)+'<br><small class="no">'+esc(t.gender)+'</small></th>'}).join('')+'</tr></thead><tbody>'+R.map(function(r,ri){return '<tr><th>'+r[0]+'</th>'+ts.map(function(t){var e=(S.logs[t.id]||{})[d];return '<td>'+(e?r[1](e):(ri===0?'<span class="no">未有記錄</span>':'—'))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
  var p=document.createElement('div');p.className='page';p.id='rpt';p.innerHTML=h;document.body.appendChild(p);
  [].forEach.call(p.querySelectorAll('img[data-id]'),function(im){getPic(im.dataset.id).then(function(x){if(x)im.src=x;else im.remove()})});
  $('#rb').onclick=closeRpt;$('#rc').onclick=function(){copy(txt.join('\n'),'已複製日報')};
}
$('#repBtn').onclick=function(){reportPage(date)};
function copy(s,msg){
  function fb(){var t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('請手動複製')}t.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(function(){toast(msg)},fb);else fb()}

/* backup */
$('#bkBtn').onclick=function(){commit();
  modal('<h3>備份同匯入</h3><p class="empty" style="margin-bottom:10px">複製下面文字存起，換手機或清除瀏覽器資料後貼返入嚟就可以還原。匯入會覆蓋目前資料。相片只存在這部裝置，不包括在備份內。</p><textarea id="bk" style="min-height:140px;font-size:12px">'+esc(JSON.stringify({turtles:S.turtles,logs:S.logs}))+'</textarea><div class="acts"><button class="btn alt" id="bkc">複製</button><button class="btn" id="bki">匯入</button></div>');
  $('#bkc').onclick=function(){copy($('#bk').value,'已複製備份')};
  $('#bki').onclick=function(){try{var o=JSON.parse($('#bk').value);if(!Array.isArray(o.turtles)||!o.turtles.length||typeof o.logs!=='object')throw 0;
    S.turtles=o.turtles.map(function(t){return{id:String(t.id),name:String(t.name||'烏龜'),gender:String(t.gender||'未知'),ts:+t.ts||Date.now()}});S.logs=cleanLogs(o.logs);S.active=S.turtles[0].id;persist();if(cl())pushAll();closeModal();date=today();renderAll();toast('已匯入')}catch(e){toast('格式唔啱，匯入失敗')}}};

/* timers: daily 22:00 report, midnight rollover */
function tick(){var n=new Date(),td=ymd(n);
  if(td!==lastDay){if(date===lastDay)date=td;lastDay=td;renderAll()}
  if(n.getHours()>=22&&S.turtles.length&&!S.shown[td]&&!$('#ov')&&!$('#rpt')){S.shown[td]=1;
    Object.keys(S.shown).forEach(function(k){if(k<shift(td,-30))delete S.shown[k]});commit();persist();reportPage(td)}}
setInterval(tick,20000);document.addEventListener('visibilitychange',function(){if(document.hidden)commit();else tick()});window.addEventListener('pagehide',commit);
['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()})});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('focusin',function(e){var t=e.target;if(t.matches&&t.matches('input,textarea')&&!t.closest('.md'))setTimeout(function(){t.scrollIntoView({block:'center'})},300)});

function renderAll(){commit();applyTheme();renderBar();paintDate();fill();renderShell(true);renderHist()}
renderAll();if(!S.turtles.length&&!hashRoom())turtleModal(null,true);tick();
if(window.CL)boot();else window.addEventListener("cloudready",boot);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,onValue,set,get,remove,update} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyCK0UqkmJLdURORXA3viDimF7JEzFf0Jig",authDomain:"turtle-record-form.firebaseapp.com",databaseURL:"https://turtle-record-form-default-rtdb.firebaseio.com",projectId:"turtle-record-form",storageBucket:"turtle-record-form.firebasestorage.app",messagingSenderId:"170829291330",appId:"1:170829291330:web:5a06ff37ec7431eaaab2db"});
const auth=getAuth(app),db=getDatabase(app);
const ready=signInAnonymously(auth).then(()=>true).catch(e=>{console.error(e);return false});
let un=[];
const R=(r,p)=>ref(db,'rooms/'+r+'/'+p);
const W=f=>(...a)=>ready.then(ok=>ok?f(...a):null).catch(e=>console.error(e));
const clean=o=>JSON.parse(JSON.stringify(o));
const tv=t=>({name:t.name,gender:t.gender,ts:t.ts||Date.now()});
window.CL={ready,
 listen(r,a,b){this.stop();const er=e=>console.error(e);un=[onValue(R(r,'turtles'),s=>a(s.val()),er),onValue(R(r,'logs'),s=>b(s.val()),er)]},
 stop(){un.forEach(f=>f());un=[]},
 putTurtle:W((r,t)=>set(R(r,'turtles/'+t.id),tv(t))),
 delTurtle:W((r,id)=>Promise.all([remove(R(r,'turtles/'+id)),remove(R(r,'logs/'+id))])),
 putLog:W((r,id,d,e)=>set(R(r,'logs/'+id+'/'+d),clean(e))),
 delLog:W((r,id,d)=>remove(R(r,'logs/'+id+'/'+d))),
 putPic:W((r,p,x)=>set(R(r,'pics/'+p),x)),
 delPic:W((r,p)=>remove(R(r,'pics/'+p))),
 getPic:(r,p)=>ready.then(ok=>ok?get(R(r,'pics/'+p)).then(s=>s.val()):null).catch(()=>null),
 pushAll:W((r,ts,logs)=>{const u={};ts.forEach(t=>{u['turtles/'+t.id]=tv(t)});Object.keys(logs).forEach(id=>Object.keys(logs[id]).forEach(d=>{u['logs/'+id+'/'+d]=clean(logs[id][d])}));return update(ref(db,'rooms/'+r),u)})
};
window.dispatchEvent(new Event('cloudready'));
</script>
</body>
</html>
